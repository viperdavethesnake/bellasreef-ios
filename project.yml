# XcodeGen spec. This file is the source of truth; the .xcodeproj is generated
# and gitignored, so project structure is a reviewable diff rather than a
# pbxproj merge conflict.
#
#   xcodegen generate && open BellasReef.xcodeproj

name: BellasReef

options:
  bundleIdPrefix: com.bellasreef
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  BellasReefKit:
    path: BellasReefKit

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO  # the generator plugin writes into DerivedData
    CODE_SIGN_STYLE: Automatic
    # Warnings are cheap now and expensive at 3am next to a tank.
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  BellasReef:
    type: application
    platform: iOS
    sources:
      - path: BellasReef
    dependencies:
      - package: BellasReefKit
        product: BellasReefKit
    info:
      path: BellasReef/Info.plist
      properties:
        CFBundleDisplayName: Bella's Reef
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Dark is primary (design brief §2): this app opens at night next to an
        # actinic-lit tank, and a white screen is a flashbang.
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # Bonjour discovery. iOS requires both the usage string and an explicit
        # service list — a browse without them silently returns nothing.
        NSLocalNetworkUsageDescription: >-
          Bella's Reef finds your hub on the local network. Nothing leaves your
          home; there is no cloud service.
        NSBonjourServices:
          - _bellasreef._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bellasreef.app
        TARGETED_DEVICE_FAMILY: "1,2"
